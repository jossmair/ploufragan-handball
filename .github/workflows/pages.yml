name: Site et résultats PHB
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Synchronisation courante du dimanche au vendredi.
    - cron: '17 */4 * * 0-5'
    # Deux tentatives espacées par heure le samedi : GitHub peut retarder ou
    # omettre un cron isolé lors des périodes chargées. Les minutes 07 et 37
    # évitent aussi la minute 00, souvent congestionnée.
    - cron: '7,37 * * * 6'
    # Deux passages supplémentaires sécurisent la bascule de 9 h locale
    # en heure d'été comme en heure d'hiver.
    - cron: '5 7,8 * * 6'

permissions: {}

concurrency:
  group: phb-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      PHB_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Récupérer le dernier snapshot sportif validé
        uses: actions/checkout@v4
        with:
          ref: phb-data-snapshots
          path: .phb-snapshots
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restaurer les snapshots sportifs
        run: python scripts/snapshot_store.py restore .phb-snapshots
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer les tests navigateur
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Vérifier le traitement des scores
        run: python -m unittest discover -s tests
      - name: Récupérer les résultats officiels
        run: python scripts/sync_results.py
      - name: Rapprocher tous les matchs à domicile du planning de salle
        run: python scripts/sync_home_duties.py
      - name: Mettre en cache les nouveaux écussons officiels
        run: python scripts/fetch_team_logos.py
        continue-on-error: true
      - name: Générer les pages
        run: python build.py
      - name: Générer le dossier partenaire
        run: npm run build:partner-pdf
      - name: Vérifier les liens internes
        run: |
          python scripts/check_site.py
          python scripts/check_build.py
          python scripts/seo_audit.py
          python scripts/check_budgets.py
      - name: Tests navigateur
        run: npm run test:e2e
      - name: Vérifier le contenu sans JavaScript
        run: npm run audit:nojs
      - name: Persister les snapshots sportifs validés
        run: |
          python scripts/snapshot_store.py save .phb-snapshots
          cd .phb-snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/home_matches.json
          if git diff --cached --quiet; then
            echo "Snapshots sportifs inchangés."
          else
            git commit -m "data: actualise les snapshots FFHandball"
            git push origin HEAD:phb-data-snapshots
          fi
      - name: Préparer les fichiers publics
        run: |
          mkdir _site
          cp *.html *.txt *.xml *.webmanifest CNAME .nojekyll _site/
          cp -r articles _site/
          cp -r assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
