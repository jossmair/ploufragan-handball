name: Site et résultats PHB
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: phb-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier le traitement des scores
        run: python -m unittest discover -s tests
      - name: Récupérer les résultats officiels
        run: python scripts/sync_results.py
      - name: Mettre en cache les nouveaux écussons officiels
        run: python scripts/fetch_team_logos.py
        continue-on-error: true
      - name: Générer les pages
        run: python build.py
      - name: Vérifier les liens internes
        run: |
          python scripts/check_site.py
          python scripts/check_build.py
          python scripts/seo_audit.py
      - name: Préparer les fichiers publics
        run: |
          mkdir _site
          cp *.html *.txt *.xml CNAME .nojekyll _site/
          cp -r articles _site/
          cp -r assets data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
